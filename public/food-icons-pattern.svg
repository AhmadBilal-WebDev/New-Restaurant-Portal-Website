    <!-- 12. Hotdog / Sandwich in Bun (row 4 left) -->
    <g transform="translate(15, 205) rotate(5)">
      <rect x="4" y="8" width="30" height="15" rx="7.5" />
      <path d="M7 15 C10 12 13 18 17 15 C21 12 24 18 28 15" />
    </g>

    <!-- 13. Heart (row 4 center-left) -->
    <g transform="translate(115, 205) rotate(15)">
      <path d="M16 26 C16 26 5 19 5 11 C5 6.5 8.5 3 13 3 C15.5 3 17.5 4.2 18.5 6 C19.5 4.2 21.5 3 24 3 C28.5 3 32 6.5 32 11 C32 19 21 26 21 26 L18.5 28 Z" />
    </g>

    <!-- 14. Hotdog / Sub (row 4 center-right) -->
    <g transform="translate(210, 205) rotate(-6)">
      <rect x="4" y="8" width="30" height="15" rx="7.5" />
      <path d="M7 15 C10 12 13 18 17 15 C21 12 24 18 28 15" />
    </g>

    <!-- 15. Fork and Knife (row 4 far right) -->
    <g transform="translate(310, 200) rotate(10)">
      <!-- Fork -->
      <path d="M6 4 L6 13 C6 16 10 16 10 13 L10 4" />
      <line x1="8" y1="4" x2="8" y2="14" />
      <line x1="8" y1="16" x2="8" y2="34" />
      <!-- Knife -->
      <path d="M18 4 C22 8 22 18 18 20 L18 34" />
    </g>

    <!-- 16. Chef Hat (row 5 left) -->
    <g transform="translate(20, 275) rotate(-10)">
      <path d="M8 26 L28 26 L26 31 L10 31 Z" />
      <path d="M8 26 C4 23 4 15 9 14 C8 10 13 6 18 7 C23 6 28 10 27 14 C32 15 32 23 28 26" />
    </g>

    <!-- 17. Burger / Buns with Patty (row 5 center-left) -->
    <g transform="translate(115, 275) rotate(4)">
      <!-- Top bun -->
      <path d="M6 14 C6 6 26 6 26 14 Z" />
      <!-- Lettuce wave -->
      <path d="M4 16 C8 18 12 15 16 18 C20 15 24 18 28 16" />
      <!-- Patty -->
      <rect x="5" y="19" width="22" height="4" rx="2" />
      <!-- Bottom bun -->
      <rect x="6" y="24" width="20" height="5" rx="2.5" />
    </g>

    <!-- 18. Teapot (row 5 center-right) -->
    <g transform="translate(225, 270) rotate(-8)">
      <path d="M12 18 C12 10 32 10 32 18 L34 32 C34 38 10 38 10 32 Z" />
      <path d="M17 10 C17 6 27 6 27 10" />
      <circle cx="22" cy="5" r="2" />
      <path d="M32 20 C42 20 44 28 34 30" />
      <path d="M10 22 C3 22 2 12 7 12" />
    </g>

    <!-- 19. Heart (row 5 far left-bottom) -->
    <g transform="translate(10, 335) rotate(14)">
      <path d="M16 26 C16 26 5 19 5 11 C5 6.5 8.5 3 13 3 C15.5 3 17.5 4.2 18.5 6 C19.5 4.2 21.5 3 24 3 C28.5 3 32 6.5 32 11 C32 19 21 26 21 26 L18.5 28 Z" />
    </g>

    <!-- 20. Coffee Cup with Steam (row 5 far right) -->
    <g transform="translate(315, 275)">
      <path d="M6 12 L24 12 L22 26 C22 29 8 29 8 26 Z" />
      <path d="M24 15 C28 15 28 22 24 22" />
      <path d="M11 5 C10 7 12 8 11 10" />
      <path d="M15 4 C14 6 16 7 15 9" />
      <path d="M19 5 C18 7 20 8 19 10" />
    </g>
