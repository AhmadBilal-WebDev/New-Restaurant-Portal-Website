<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!-- Warm Food & Kitchen Icon Doodles - Matches Bite & Burger Wallpaper Pattern -->
  <g stroke="#E0A045" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.28">
    <!-- 1. Teapot (top left) -->
    <g transform="translate(30, 20)">
      <path d="M12 18 C12 10 32 10 32 18 L34 32 C34 38 10 38 10 32 Z" />
      <path d="M17 10 C17 6 27 6 27 10" />
      <circle cx="22" cy="5" r="2" />
      <path d="M32 20 C42 20 44 28 34 30" />
      <path d="M10 22 C3 22 2 12 7 12" />
    </g>

    <!-- 2. Cocktail / Martini Glass (top center) -->
    <g transform="translate(130, 15) rotate(10)">
      <path d="M5 8 L25 8 L15 22 Z" />
      <path d="M15 22 L15 35" />
      <path d="M8 35 L22 35" />
      <path d="M22 6 L28 2" />
      <circle cx="15" cy="14" r="2.5" />
    </g>

    <!-- 3. Heart (top right-center) -->
    <g transform="translate(235, 20) rotate(-12)">
      <path d="M16 26 C16 26 5 19 5 11 C5 6.5 8.5 3 13 3 C15.5 3 17.5 4.2 18.5 6 C19.5 4.2 21.5 3 24 3 C28.5 3 32 6.5 32 11 C32 19 21 26 21 26 L18.5 28 Z" />
    </g>

    <!-- 4. Teapot (top right) -->
    <g transform="translate(315, 20)">
      <path d="M12 18 C12 10 32 10 32 18 L34 32 C34 38 10 38 10 32 Z" />
      <path d="M17 10 C17 6 27 6 27 10" />
      <circle cx="22" cy="5" r="2" />
      <path d="M32 20 C42 20 44 28 34 30" />
      <path d="M10 22 C3 22 2 12 7 12" />
    </g>

    <!-- 5. Popsicle / Ice Cream Bar (row 2 left) -->
    <g transform="translate(68, 75) rotate(8)">
      <rect x="6" y="4" width="16" height="24" rx="8" />
      <line x1="14" y1="28" x2="14" y2="38" />
      <line x1="10" y1="12" x2="10" y2="20" stroke-dasharray="1 3" />
    </g>

    <!-- 6. Fork and Knife (row 2 center-left) -->
    <g transform="translate(165, 70) rotate(-15)">
      <!-- Fork -->
      <path d="M6 4 L6 13 C6 16 10 16 10 13 L10 4" />
      <line x1="8" y1="4" x2="8" y2="14" />
      <line x1="8" y1="16" x2="8" y2="34" />
      <!-- Knife -->
      <path d="M18 4 C22 8 22 18 18 20 L18 34" />
    </g>

    <!-- 7. Popsicle (row 2 center-right) -->
    <g transform="translate(265, 75) rotate(5)">
      <rect x="6" y="4" width="16" height="24" rx="8" />
      <line x1="14" y1="28" x2="14" y2="38" />
      <line x1="14" y1="10" x2="14" y2="18" stroke-dasharray="1 3" />
    </g>

    <!-- 8. Smiling Face Emoji (row 3 far left) -->
    <g transform="translate(15, 130) rotate(-6)">
      <circle cx="18" cy="18" r="14" />
      <circle cx="13" cy="14" r="1.5" fill="#E0A045" stroke="none" />
      <circle cx="23" cy="14" r="1.5" fill="#E0A045" stroke="none" />
      <path d="M12 21 C14 25 22 25 24 21" />
    </g>

    <!-- 9. Chef Hat (row 3 middle-left) -->
    <g transform="translate(100, 135) rotate(12)">
      <path d="M8 26 L28 26 L26 31 L10 31 Z" />
      <path d="M8 26 C4 23 4 15 9 14 C8 10 13 6 18 7 C23 6 28 10 27 14 C32 15 32 23 28 26" />
    </g>

    <!-- 10. Smiling Face Emoji (row 3 center-right) -->
    <g transform="translate(205, 130) rotate(8)">
      <circle cx="18" cy="18" r="14" />
      <circle cx="13" cy="14" r="1.5" fill="#E0A045" stroke="none" />
      <circle cx="23" cy="14" r="1.5" fill="#E0A045" stroke="none" />
      <path d="M12 21 C14 25 22 25 24 21" />
    </g>

    <!-- 11. Cocktail / Glass (row 3 far right) -->
    <g transform="translate(305, 135) rotate(-10)">
      <path d="M5 8 L25 8 L15 22 Z" />
      <path d="M15 22 L15 35" />
      <path d="M8 35 L22 35" />
      <path d="M22 6 L28 2" />
